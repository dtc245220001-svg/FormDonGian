<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form thông tin cá nhân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        form {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: inline-block;
            width: 100px;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="email"] {
            width: 250px;
            padding: 8px;
            margin-bottom: 15px;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form>

        <h2>THÔNG TIN CÁ NHÂN</h2>

        <label>Họ và tên:</label>
        <input type="text" name="yourname">

        <br>

        <label>Email:</label>
        <input type="email" name="email">

        <br>

        <label>Sở thích:</label>

        <input type="checkbox" name="hobby" value="music">
        Nghe nhạc

        <br>

        <label></label>
        <input type="checkbox" name="hobby" value="sports">
        Thể thao

        <br>

        <label></label>
        <input type="checkbox" name="hobby" value="reading">
        Đọc sách

        <br>

        <label></label>
        <input type="checkbox" name="hobby" value="travel">
        Du lịch

        <div class="buttons">
            <input type="submit" value="Gửi thông tin">
            <input type="reset" value="Nhập lại">
        </div>

    </form>

</body>
</html>
